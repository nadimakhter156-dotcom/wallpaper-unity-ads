name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Fast Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          if [ -d "UnityAds-Android-Project" ]; then
            cd UnityAds-Android-Project
          fi

          # 1. Accept Android licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

          # 2. Fix source typos automatically
          sed -i 's/CenterVertigo/CenterVertically/g' app/src/main/java/com/aizoid/unityadsdemo/ui/components/HeaderCard.kt 2>/dev/null || true
          sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml 2>/dev/null || true
          sed -i 's/@mipmap\/ic_launcher_round/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml 2>/dev/null || true

          # 3. Build APK
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Wallpaper-UnityAds-app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
