name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Setup Fast Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          # If project files are inside a subfolder, navigate into it
          if [ -d "UnityAds-Android-Project" ]; then
            cd UnityAds-Android-Project
          fi

          # 1. Ensure gradle.properties exists with AndroidX enabled
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx1024m
          EOF

          # 2. Ensure resource files exist
          mkdir -p app/src/main/res/values

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Wallpaper</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.UnityAdsDemo" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#0B0818</item>
                  <item name="android:navigationBarColor">#080612</item>
                  <item name="android:windowBackground">#0B0818</item>
              </style>
          </resources>
          EOF

          # 3. Clean up AndroidManifest (remove missing xml references and use default icon)
          sed -i '/dataExtractionRules/d' app/src/main/AndroidManifest.xml 2>/dev/null || true
          sed -i '/fullBackupContent/d' app/src/main/AndroidManifest.xml 2>/dev/null || true
          sed -i 's/@mipmap\/ic_launcher_round/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml 2>/dev/null || true
          sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml 2>/dev/null || true

          # 4. Accept Android SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

          # 5. Compile the APK
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Wallpaper-UnityAds-app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
