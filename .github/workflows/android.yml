
name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 4. Setup Gradle 8.7
      - name: Setup Fast Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 5. Build APK
      - name: Build Debug APK
        run: |
          set -e

          if [ -d "UnityAds-Android-Project" ]; then
            cd UnityAds-Android-Project
          fi

          echo "Checking Android SDK..."
          echo "ANDROID_HOME=$ANDROID_HOME"

          # Fix Kotlin typo
          if [ -f "app/src/main/java/com/aizoid/unityadsdemo/ui/components/HeaderCard.kt" ]; then
            sed -i 's/CenterVertigo/CenterVertically/g' app/src/main/java/com/aizoid/unityadsdemo/ui/components/HeaderCard.kt
          fi

          # Fix launcher icon references
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/@mipmap\/ic_launcher_round/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml
            sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml
          fi

          # Build
          echo "Starting APK build..."

          gradle assembleDebug --no-daemon --stacktrace

          echo "APK build completed!"

      # 6. Upload APK
      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Wallpaper-UnityAds-app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
